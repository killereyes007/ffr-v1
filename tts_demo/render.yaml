services:
  - type: web
    name: assistant-vocal-fon-test
    runtime: python
    plan: free
    rootDir: tts_demo
    buildCommand: pip install -r requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: python assistant_app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: HOST
        value: 0.0.0.0
      - key: OPENROUTER_MODEL
        value: openrouter/auto
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_DASHBOARD_TOKEN
        sync: false
